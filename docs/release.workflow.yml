# بناء → اختبار → توقيع → نشر Release تلقائياً عند كل push إلى main.
# التطبيق يقرأ Release الأخير ويحدّث نفسه (lib/services/update_service.dart).
#
# المتطلب الوحيد خارج المستودع: Secret باسم SECRETS_PASSPHRASE (انظر docs/SECRETS.md).
name: release

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'secrets/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: 'ملاحظات الإصدار (اختياري)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.35.4'
  JAVA_VERSION: '17'
  # رقم البناء = رقم التشغيل + 100 حتى يبقى أعلى من الإصدارات اليدوية القديمة (آخرها 4).
  BUILD_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: تحقق من وجود كلمة فك التشفير
        env:
          PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::Secret SECRETS_PASSPHRASE غير موجود. أضفه مرة واحدة: Settings → Secrets → Actions. التفاصيل في docs/SECRETS.md"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: فك تشفير مفاتيح التوقيع
        env:
          PASSPHRASE: ${{ secrets.SECRETS_PASSPHRASE }}
        run: |
          gpg --batch --yes --decrypt --passphrase "$PASSPHRASE" -o android/release-key.jks secrets/release-key.jks.gpg
          gpg --batch --yes --decrypt --passphrase "$PASSPHRASE" -o android/key.properties secrets/key.properties.gpg
          test -s android/release-key.jks && test -s android/key.properties

      - name: حساب الإصدار
        id: ver
        run: |
          NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          CODE=$(( ${{ github.run_number }} + ${{ env.BUILD_OFFSET }} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME+$CODE" >> "$GITHUB_OUTPUT"
          echo "الإصدار: $NAME ($CODE)"

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded

      - name: بناء APK موقّع (arm64 فقط، مُبهَّم)
        run: |
          flutter build apk --release \
            --target-platform=android-arm64 \
            --obfuscate --split-debug-info=build/symbols \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }} \
            --dart-define=APP_BUILD_NUMBER=${{ steps.ver.outputs.code }} \
            --dart-define=APP_COMMIT=${{ github.sha }}

      - name: تحقق من الـAPK (ABI، التوقيع، versionCode)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E "package:|native-code"
          "$BT/aapt" dump badging "$APK" | grep -q "native-code: 'arm64-v8a'"
          ! unzip -l "$APK" | grep -qE "lib/(armeabi-v7a|x86|x86_64)/"
          "$BT/aapt" dump badging "$APK" | grep -q "versionCode='${{ steps.ver.outputs.code }}'"

      - name: تجهيز الأصول
        id: assets
        run: |
          mkdir -p out
          APK=build/app/outputs/flutter-apk/app-release.apk
          NAME=point_gps_${{ steps.ver.outputs.name }}_${{ steps.ver.outputs.code }}_arm64.apk
          cp "$APK" "out/$NAME"
          SHA=$(sha256sum "out/$NAME" | cut -d' ' -f1)
          echo "$SHA  $NAME" > "out/$NAME.sha256"
          SIZE=$(stat -c%s "out/$NAME")
          (cd build && zip -qr ../out/symbols.zip symbols) || true
          cp build/app/outputs/mapping/release/mapping.txt out/mapping.txt || true
          # بيان التحديث الذي يقرؤه التطبيق
          cat > out/latest.json <<EOF
          {
            "versionName": "${{ steps.ver.outputs.name }}",
            "versionCode": ${{ steps.ver.outputs.code }},
            "tag": "${{ steps.ver.outputs.tag }}",
            "apk": "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/$NAME",
            "sha256": "$SHA",
            "sizeBytes": $SIZE,
            "minSdk": 26,
            "abi": "arm64-v8a",
            "commit": "${{ github.sha }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": $(printf '%s' "${{ github.event.inputs.notes || github.event.head_commit.message }}" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')
          }
          EOF
          cat out/latest.json
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: نشر Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: نقطة ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          body: |
            **APK:** `${{ steps.assets.outputs.apk }}` — arm64-v8a فقط، موقّع، مُبهَّم.
            **SHA-256:** `${{ steps.assets.outputs.sha }}`
            **Commit:** ${{ github.sha }}

            ${{ github.event.inputs.notes || github.event.head_commit.message }}

            التطبيق المثبّت يكتشف هذا الإصدار تلقائياً عبر `latest.json` ويعرض زر «تحديث».
          files: |
            out/*.apk
            out/*.sha256
            out/latest.json
            out/symbols.zip
            out/mapping.txt
          fail_on_unmatched_files: false
          make_latest: true
