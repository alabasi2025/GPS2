name: point_gps
description: "نقطة — تحديد الموقع بأعلى دقة ممكنة من الهاتف (GNSS خام، L1+L5، Kalman، تجميع ثابت)."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # خريطة OpenStreetMap — مجانية بلا مفتاح.
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  # مشاركة الموقع/ملف CSV عبر واتساب وغيره.
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon_192.webp
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
